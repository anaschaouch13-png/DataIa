{% extends "base.html" %} {% block content %}
<div
  class="d-flex justify-content-center align-items-center"
  style="min-height: 80vh"
>
  <div
    class="card shadow-lg border-0"
    style="width: 100%; max-width: 450px; border-radius: 15px"
  >
    <div class="card-body p-5">
      <h3 class="text-center mb-4" style="color: #1e272e; font-weight: 600">
        Créer un Compte
      </h3>
      <p class="text-muted text-center mb-4">
        Rejoignez DataIA pour analyser vos données.
      </p>

      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Nom d'utilisateur</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"
              ><i class="fas fa-user text-muted"></i
            ></span>
            <input
              type="text"
              name="nom_utilisateur"
              class="form-control bg-light border-0"
              placeholder="nom123"
              value="{{ formulaire.nom_utilisateur if formulaire else '' }}"
              required
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Adresse Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"
              ><i class="fas fa-envelope text-muted"></i
            ></span>
            <input
              type="email"
              name="email"
              class="form-control bg-light border-0"
              placeholder="nom@dataia.com"
              value="{{ formulaire.email if formulaire else '' }}"
              required
            />
          </div>
        </div>

        <!-- Phase 2 : domaine d'activité (détermine les modèles ML proposés) -->
        <div class="mb-3">
          <label class="form-label" for="domaine">Domaine d'activité</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"
              ><i class="fas fa-briefcase text-muted"></i
            ></span>
            <select id="domaine" name="domaine" class="form-select bg-light border-0" required>
              <option value="" disabled {{ 'selected' if not (formulaire and formulaire.domaine) else '' }}>
                Choisissez votre domaine…
              </option>
              {% for d in DOMAINES %}
              <option value="{{ d }}" {{ 'selected' if formulaire and formulaire.domaine == d else '' }}>{{ d }}</option>
              {% endfor %}
            </select>
          </div>
          <small class="text-muted">Les modèles d'analyse proposés dépendent de votre domaine (modifiable dans votre profil).</small>
        </div>

        <div class="mb-4">
          <label class="form-label">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"
              ><i class="fas fa-lock text-muted"></i
            ></span>
            <input
              type="password"
              name="password"
              class="form-control bg-light border-0"
              placeholder="••••••••"
              required
            />
          </div>
        </div>

        <button
          type="submit"
          class="btn w-100 py-2 shadow-sm"
          style="
            background: linear-gradient(45deg, #00d2d3, #0984e3);
            color: white;
            border-radius: 8px;
            font-weight: 600;
          "
        >
          S'inscrire
        </button>
      </form>

      <div class="text-center mt-4">
        <small class="text-muted"
          >Vous avez déjà un compte ?
          <a
            href="{{ url_for('login') }}"
            style="color: #1e272e; text-decoration: none; font-weight: 600"
            >Se connecter</a
          ></small
        >
      </div>
    </div>
  </div>
</div>
{% endblock %}
